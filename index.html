<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BidBlocks · AI Generation State</title>

<link rel="stylesheet" href="_ds/bidblocks-design-system/colors_and_type.css" />
<link rel="stylesheet" href="_ds/bidblocks-design-system/components.css" />

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--font-ui); color: var(--text-primary); background: var(--N02); }
  #canvas-root { height: 100vh; }

  .sub { color: var(--text-secondary); font-size: var(--fs-small); }
  .crumb { display: flex; align-items: center; gap: 8px; font-size: var(--fs-small); color: var(--text-secondary); }
  .crumb .sep { color: var(--U20); }
  .crumb b { color: var(--text-primary); font-weight: var(--fw-semibold); }
  .avatar { width: 28px; height: 28px; border-radius: var(--radius-full); background: var(--surface-neutral); color: var(--N70);
    display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: var(--fw-semibold); flex: none; }
  .bar-track { height: 6px; background: var(--U3); border-radius: var(--radius-full); overflow: hidden; }
  .bar-track.lg { height: 8px; }
  .bar-fill { height: 100%; background: var(--BUI50); border-radius: var(--radius-full); transition: width .18s linear; }

  /* spinners */
  .gen-spin { width: 18px; height: 18px; border: 2px solid var(--BUI10); border-top-color: var(--BUI50); border-radius: 50%; animation: genRot .8s linear infinite; flex: none; }
  .gen-spin.sm { width: 15px; height: 15px; border-width: 2px; }
  @keyframes genRot { to { transform: rotate(360deg); } }

  /* skeleton + shimmer */
  .gen-skel { display: inline-block; position: relative; overflow: hidden; background: var(--U3); border-radius: var(--radius-xs); }
  .gen-skel::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.85), transparent); animation: genShimmer 1.5s infinite; }
  @keyframes genShimmer { 100% { transform: translateX(100%); } }

  .gen-cell-val { display: inline-flex; align-items: center; gap: 6px; animation: genFade .35s ease both; }
  @keyframes genFade { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: none; } }

  /* sparkle badges */
  .gen-spark-badge { width: 40px; height: 40px; flex: none; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center;
    background: var(--surface-button-tonal); color: var(--BUI50); position: relative; transition: background-color .2s, color .2s; }
  .gen-spark-badge.sm { width: 32px; height: 32px; border-radius: var(--radius-sm); }
  .gen-spark-badge.busy::before { content: ""; position: absolute; inset: -2px; border-radius: inherit; padding: 2px;
    background: conic-gradient(from 0deg, transparent, var(--BUI40)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; animation: genRot 1.4s linear infinite; }
  .gen-spark-badge.done { background: var(--success-light); color: var(--green-700); }
  .gen-spark { animation: genPulse 1.6s ease-in-out infinite; }
  @keyframes genPulse { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.14); opacity: 1; } }

  /* generation card */
  .gen-card { display: flex; flex-direction: column; gap: var(--spacing-sm); padding: var(--spacing-md); }
  .gen-head { display: flex; align-items: center; gap: var(--spacing-xs); }
  .gen-head.sm { gap: 10px; }
  .gen-head-txt { flex: 1; min-width: 0; }
  .gen-head-line { font-size: var(--fs-medium); font-weight: var(--fw-semibold); color: var(--text-primary); line-height: 1.3;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gen-head-line.sm { font-size: var(--fs-small); }
  .gen-head-sub { font-size: var(--fs-xsmall); color: var(--text-secondary); margin-top: 2px; }
  .gen-head-actions { display: flex; align-items: center; gap: var(--spacing-2xs); flex: none; }
  .gen-stop { color: var(--text-system-danger); border-color: var(--R100); }
  .gen-stop:hover { background: var(--alert-light); border-color: var(--R100); }
  .gen-bar { margin-top: -4px; }

  /* summary strip */
  .gen-summary { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--success-light);
    border: 1px solid var(--green-500); border-radius: var(--radius-md); font-size: var(--fs-small); color: var(--text-primary); }
  .gen-sum-ic { color: var(--green-700); flex: none; }
  .gen-summary b { font-weight: var(--fw-semibold); }
  .gen-sum-pills { margin-left: auto; display: flex; gap: 6px; flex: none; }

  /* comparison table */
  .gen-tbl { border: 1px solid var(--border-inactive); border-radius: var(--radius-md); overflow: hidden; }
  .gen-tr { display: grid; grid-template-columns: 1.35fr 1fr 1fr 1fr; align-items: stretch; }
  .gen-tr + .gen-tr { border-top: 1px solid var(--border-inactive); }
  .gen-thead { background: var(--N02); }
  .gen-th { padding: 10px 14px; display: flex; align-items: center; gap: 8px; border-left: 1px solid var(--border-inactive); }
  .gen-th.gen-crit-h { border-left: none; font-size: var(--fs-2xsmall); font-weight: var(--fw-semibold); letter-spacing: var(--ls-xlarge);
    text-transform: uppercase; color: var(--text-secondary); }
  .gen-th-ic { width: 24px; height: 24px; flex: none; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center;
    background: var(--surface-button-tonal); color: var(--BUI60); }
  .gen-th-ic.c2 { background: var(--success-light); color: var(--green-700); }
  .gen-th-txt { min-width: 0; }
  .gen-th-txt b { display: block; font-size: var(--fs-small); font-weight: var(--fw-semibold); line-height: 1.2;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gen-th-txt span { font-size: 10px; color: var(--text-disabled); }
  .gen-td { padding: 11px 14px; display: flex; align-items: center; font-size: var(--fs-small); }
  .gen-td.gen-crit { gap: 9px; color: var(--text-primary); font-weight: var(--fw-medium); background: var(--U2); }
  .gen-td.gen-crit .lucide { color: var(--text-navigation); flex: none; }
  .gen-val { border-left: 1px solid var(--border-inactive); color: var(--U70); }
  .gen-val.al-divergent { background: var(--alert-light); color: var(--text-system-danger); font-weight: var(--fw-medium); }
  .gen-val.al-partial { background: var(--info-light); }
  .gen-mini { flex: none; }
  .gen-mini.ok { color: var(--green-700); }
  .gen-mini.warn { color: var(--red-500); }

  /* A · stepper */
  .gen-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .gen-step { display: flex; align-items: center; gap: 11px; font-size: var(--fs-small); }
  .gen-step .ic { width: 18px; height: 18px; flex: none; display: flex; align-items: center; justify-content: center; }
  .gen-step.pending { color: var(--text-disabled); }
  .gen-step.pending .ic { color: var(--U20); }
  .gen-step.active { color: var(--text-primary); font-weight: var(--fw-medium); }
  .gen-step.done { color: var(--text-secondary); }
  .gen-step.done .ic { color: var(--green-700); }

  /* B · progress */
  .gen-pct { font-size: var(--fs-large); font-weight: var(--fw-semibold); color: var(--text-primary); flex: none; font-variant-numeric: tabular-nums; }
  .gen-docs-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .gen-doc { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--border-inactive); border-radius: var(--radius-md);
    background: var(--White); transition: opacity .25s, border-color .25s; }
  .gen-doc.dim { opacity: .5; }
  .gen-doc.lit { border-color: var(--BUI20); }
  .gen-doc-ic { width: 26px; height: 26px; flex: none; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center;
    background: var(--surface-button-tonal); color: var(--BUI60); }
  .gen-doc.dim .gen-doc-ic { background: var(--U3); color: var(--U30); }
  .gen-doc-txt { min-width: 0; }
  .gen-doc-txt b { display: block; font-size: var(--fs-xsmall); font-weight: var(--fw-semibold); line-height: 1.2;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gen-doc-txt span { font-size: 10px; color: var(--text-disabled); }
  .gen-now { display: flex; align-items: center; gap: 9px; font-size: var(--fs-small); color: var(--text-secondary); }
  .gen-now-ok { color: var(--green-700); flex: none; }
  .gen-now-btn { margin-left: auto; flex: none; }

  /* C · calm */
  .v-calm { align-items: center; justify-content: center; text-align: center; gap: 14px; padding: var(--spacing-lg) var(--spacing-md); }
  .gen-calm-spark { width: 48px; height: 48px; border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center;
    background: var(--surface-button-tonal); color: var(--BUI50); }
  .gen-calm-spark.done { background: var(--success-light); color: var(--green-700); }
  .gen-calm-line { font-size: var(--fs-large); font-weight: var(--fw-medium); color: var(--text-primary); line-height: 1.3; min-height: 22px; }
  .gen-calm-sub { font-size: var(--fs-small); color: var(--text-secondary); }
  .gen-indet-wrap { width: 70%; }
  .gen-indet { height: 3px; background: var(--U3); border-radius: var(--radius-full); overflow: hidden; }
  .gen-indet > i { display: block; height: 100%; width: 40%; border-radius: var(--radius-full); background: var(--BUI50); animation: genIndet 1.5s ease-in-out infinite; }
  .gen-indet.done > i { background: var(--green-500); animation: none; }
  @keyframes genIndet { 0% { transform: translateX(-110%); } 100% { transform: translateX(320%); } }
  .gen-calm-btn { margin-top: 2px; }

  /* D · expressive */
  .v-expressive { gap: var(--spacing-sm); }
  .gen-exp-head { display: flex; align-items: center; gap: 10px; }
  .gen-exp-spark { width: 32px; height: 32px; flex: none; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center;
    color: var(--White); background: linear-gradient(135deg, var(--BUI50), var(--BUI40)); background-size: 180% 180%; animation: genGrad 3s ease infinite; }
  .gen-exp-spark.done { background: var(--green-700); animation: none; }
  @keyframes genGrad { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  .gen-exp-cards { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .gen-exp-card { position: relative; overflow: hidden; border: 1px solid var(--border-inactive); border-radius: var(--radius-md); padding: 11px;
    background: var(--White); display: flex; flex-direction: column; gap: 5px; transition: border-color .3s, box-shadow .3s, opacity .3s; }
  .gen-exp-card.wait { opacity: .55; }
  .gen-exp-card.scan { border-color: var(--BUI40); box-shadow: 0 0 0 1px var(--BUI20); }
  .gen-exp-card.read { border-color: var(--green-500); }
  .gen-exp-card-top { display: flex; align-items: center; justify-content: space-between; color: var(--text-navigation); }
  .gen-exp-ok { color: var(--green-700); }
  .gen-exp-card b { font-size: var(--fs-xsmall); font-weight: var(--fw-semibold); line-height: 1.2; }
  .gen-exp-meta { font-size: 10px; color: var(--text-disabled); }
  .gen-exp-lines { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
  .gen-scan-line { position: absolute; left: 0; right: 0; height: 30px; top: -30px;
    background: linear-gradient(180deg, transparent, var(--BUI50-16), transparent); animation: genScan 1.5s ease-in-out infinite; }
  @keyframes genScan { 0% { top: -30px; } 100% { top: 100%; } }
  .gen-exp-result { display: flex; align-items: center; gap: 9px; padding: 11px 14px; border-radius: var(--radius-md);
    background: var(--surface-secondary); border: 1px dashed var(--border-primary); color: var(--text-secondary); font-size: var(--fs-small);
    opacity: .6; transition: all .3s; }
  .gen-exp-result .lucide { flex: none; }
  .gen-exp-result.show { opacity: 1; background: var(--success-light); border: 1px solid var(--green-500); border-style: solid; color: var(--text-primary); }
  .gen-exp-result.show .lucide { color: var(--green-700); }
  .gen-exp-result.show .badge { margin-left: auto; }

  /* HERO app shell */
  .gen-app { display: flex; height: 100%; background: var(--surface-secondary); }
  .gen-rail { width: 56px; flex: none; background: var(--White); border-right: 1px solid var(--border-inactive);
    display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 4px; }
  .gen-mark { width: 34px; height: 34px; border-radius: var(--radius-md); background: var(--BUI70); color: var(--White);
    font-family: var(--font-title-large); font-size: 21px; display: flex; align-items: center; justify-content: center; margin-bottom: 6px; }
  .gen-rail-sep { width: 26px; height: 1px; background: var(--border-inactive); margin: 4px 0; }
  .gen-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .gen-topbar { height: 56px; flex: none; background: var(--White); border-bottom: 1px solid var(--border-inactive);
    display: flex; align-items: center; padding: 0 var(--spacing-md); }
  .gen-top-actions { margin-left: auto; }
  .gen-body { flex: 1; min-height: 0; padding: var(--spacing-md) var(--spacing-xl); overflow: hidden; }
  .gen-pagehead { display: flex; align-items: baseline; gap: var(--spacing-sm); margin-bottom: var(--spacing-sm); }
  .gen-pagehead h1 { margin: 0; }

  /* reduced motion */
  @media (prefers-reduced-motion: reduce) {
    .gen-skel::after, .gen-spark, .gen-scan-line, .gen-indet > i, .gen-spark-badge.busy::before, .gen-exp-spark { animation: none; }
    .gen-indet > i { width: 100%; }
  }
</style>
</head>
<body>
<div id="canvas-root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="gen-core.jsx"></script>
<script type="text/babel" src="gen-views.jsx"></script>

<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard } = window;

  function Board() {
    return (
      <DesignCanvas>
        <DCSection id="hero" title="AI generation — in context" subtitle="Research assistant · Compare documents · productive skeleton that fills in, then resolves to the result">
          <DCArtboard id="hero-1" label="Comparing documents → comparison ready" width={980} height={660}>
            <GenHero />
          </DCArtboard>
        </DCSection>

        <DCSection id="variations" title="Loading-state variations" subtitle="Same lifecycle, four treatments — each loops generate → reveal. Mix & match.">
          <DCArtboard id="v-stepped" label="A · Stepped checklist" width={460} height={300}>
            <VarStepped />
          </DCArtboard>
          <DCArtboard id="v-progress" label="B · Determinate progress" width={460} height={320}>
            <VarProgress />
          </DCArtboard>
          <DCArtboard id="v-calm" label="C · Calm / minimal" width={460} height={300}>
            <VarCalm />
          </DCArtboard>
          <DCArtboard id="v-expressive" label="D · Expressive / scanning" width={560} height={360}>
            <VarExpressive />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('canvas-root')).render(<Board />);
</script>
</body>
</html>
